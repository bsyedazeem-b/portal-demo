<script src="assets/config.js"></script>
<script src="assets/letterhead.js"></script>
<script src="assets/portal.js" data-module="docs"></script>
<style>
.docnav{margin:16px 0 6px;background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(30,60,80,.08);overflow:hidden}
.docgroups{display:flex;gap:6px;padding:6px;background:#F0F4F5;overflow-x:auto;scrollbar-width:none}
.docgroups::-webkit-scrollbar,.docsub::-webkit-scrollbar{display:none}
.docgroups a{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 16px;border-radius:10px;color:var(--muted);
  font:600 14px var(--font);text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.docgroups a:hover{color:var(--text);background:rgba(255,255,255,.6)}
.docgroups a svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.docgroups a.on{background:#fff;color:var(--teal);box-shadow:0 1px 4px rgba(30,60,80,.12)}
.docsub{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.docsub a{position:relative;padding:12px 14px;color:var(--muted);font:500 13.5px var(--font);text-decoration:none;white-space:nowrap}
.docsub a:hover{color:var(--text)}
.docsub a.on{color:var(--teal);font-weight:600}
.docsub a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--teal)}
.docsub a[hidden]{display:none}
.docgroups a .sm{display:none}
@media (max-width:640px){.docgroups a{padding:9px 6px;gap:6px;font-size:13.5px}.docgroups a svg{width:17px;height:17px}.docgroups a .lg{display:none}.docgroups a .sm{display:inline}.docsub{padding:0 4px}.docsub a{padding:12px 11px}}
.ahhead .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.tools .field{margin:0}
.tools input[type=search]{width:min(340px,100%)}
td .btn{margin-right:4px}
td.no{font-weight:600;color:var(--text);white-space:nowrap}
.res{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.res.PASS{background:#E5F5EC;color:#23794F}
.res.FAIL{background:#FCE8EB;color:#B4283D}
.res.draft{background:#FFF1E6;color:#B5591A}
.res.paid{background:#E5F5EC;color:#23794F}.res.partial{background:#E6EEF8;color:#2B66A6}.res.unpaid{background:#EEF1F3;color:#5E6E76}.res.overdue{background:#FCE8EB;color:#B4283D}
.status-line{margin:2px 0 14px;font-size:14px}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#F7FAFB}
.who{display:flex;align-items:center;gap:10px}
.mini{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:11.5px}

/* form */
.sheet{background:#fff;border-radius:12px;padding:6px 22px 20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(30,60,80,.06)}
.sheet h3{color:var(--text);font-size:15px;font-weight:600;margin:18px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px}
.field input,.field select,.field textarea{width:100%}
textarea{resize:vertical;min-height:70px}
.fixed{padding:9px 11px;background:#F2F8F9;border:1px dashed #CFE2E6;border-radius:8px;font-weight:600;color:var(--teal-dark)}
.choice{display:flex;gap:18px;flex-wrap:wrap;padding:6px 0}
.choice label{display:flex;align-items:center;gap:7px;font-weight:500;cursor:pointer}
.choice input{width:18px;height:18px;margin:0;accent-color:var(--teal)}
.choice.result label{padding:7px 16px;border:1.5px solid var(--border);border-radius:99px}

<body>
<div class="ahhead">
  <div class="row"><div><h1>Documents</h1><p>Company documents: save, approve, download PDFs and share.</p></div><span class="pill" id="myRole"></span></div>

      <a href="#jobcard" data-g="work"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><span class="lg">Operations &amp; Purchasing</span><span class="sm">Workshop</span></a>

<main>
  <div id="view"></div>
</main>
<div id="toast" hidden></div>

<script>
(async () => {
/* ============================== setup ============================== */
const U = await window.PORTAL_READY;
const sb = window.portalSb;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const view = $('#view');
const ROLE = U.docs_role;                       // manager | staff | viewer
const CAN_EDIT = ROLE === 'manager' || ROLE === 'staff';
const CAN_DELETE = ROLE === 'manager';
$('#myRole').textContent = ROLE;
const BUCKET = 'docs';
const today = () => new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Riyadh'}).format(new Date());
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric'}) : '';

let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 6000 : 3000);
}
const nice = e => (e && (e.message || e.error_description)) || String(e);

/* ============================== data ============================== */
const nameOf = (() => { let cache = null;
  return async id => {
    if (!id) return '';
    if (!cache) { const {data} = await sb.from('portal_users').select('id, full_name, username'); cache = Object.fromEntries((data || []).map(u => [u.id, u.full_name || u.username])); }
    return cache[id] || '';
  };
})();
/* ============================== images ============================== */
const blobToDataUrl = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(b); });
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Could not load image')); i.src = src; });
async function shrink(file, max, type, quality) {
  const img = await loadImg(URL.createObjectURL(file));
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  const g = c.getContext('2d');
  if (type === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
  g.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  const blob = await new Promise(r => c.toBlob(r, type, quality));
  return {blob, dataUrl: await blobToDataUrl(blob), w: c.width, h: c.height};
}
async function fileFromStorage(path) {
  const {data, error} = await sb.storage.from(BUCKET).download(path);
  if (error) throw error;
  const dataUrl = await blobToDataUrl(data);
  const img = await loadImg(dataUrl);
  return {dataUrl, w: img.naturalWidth, h: img.naturalHeight};
}
let ASSETS = null;
async function assets() {
  if (ASSETS) return ASSETS;
  const {header, footer, stamp} = await window.brandLetterhead();   // drawn from assets/config.js (see assets/letterhead.js)
  return ASSETS = {header, footer, stamp};
}

/* ============================== PDF ============================== */
const C = {slate: BRAND.rgb(BRAND.colors.brandDark), orange: BRAND.rgb(BRAND.colors.accent), ink: [28, 36, 40], muted: [110, 122, 128], line: [176, 190, 195], shade: [236, 242, 243], green: [45, 122, 76], red: [179, 38, 30]};

/* ============================== public PDF links (WhatsApp) ============================== */
const CERT_BUCKET = 'certs';
const newToken = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');   // 128-bit, unguessable
const certUrl = t => `${String(PORTAL_CONFIG.SUPABASE_URL).replace(/\/+$/, '')}/storage/v1/object/public/${CERT_BUCKET}/${t}.pdf`;

/* ============================== small helpers ============================== */
const AV_COLORS = [BRAND.colors.brand, BRAND.colors.accent, '#2E9E6A', '#3B82C4', '#8A5CC2', '#D9475B', '#C27A1A'];
function who(name) {
  const n = String(name || '').trim(); if (!n) return '';
  let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const ini = n.split(/\s+/).filter(w => /\w/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase() || n[0];
  return `<span class="who"><span class="mini" style="background:${AV_COLORS[h % AV_COLORS.length]}">${esc(ini)}</span>${esc(n)}</span>`;
}

/* Share a PDF: phones open the share sheet (WhatsApp, email, …) with the PDF attached;
   computers download the PDF and open WhatsApp Web / the email app with a ready message. */
function wireShare(btn, getPdf, getName, getText) {
  btn.addEventListener('click', async e => {
    e.stopPropagation();
    const old = btn.textContent; btn.disabled = true; btn.textContent = 'Please wait…';
    try {
      const pdf = await getPdf(), name = getName(), text = getText();
      const file = new File([pdf.output('blob')], name, {type: 'application/pdf'});
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        try { await navigator.share({files: [file], title: name, text}); } catch (err) { if (err.name !== 'AbortError') throw err; }
        return;
      }
      document.querySelectorAll('.sharemenu').forEach(m => m.remove());
      const m = document.createElement('div'); m.className = 'sharemenu';
      m.innerHTML = '<button type="button" data-s="wa">WhatsApp</button><button type="button" data-s="mail">Email</button><button type="button" data-s="dl">Download PDF only</button>';
      btn.parentElement.appendChild(m);
      m.addEventListener('click', ev => {
        const k = ev.target.dataset.s; if (!k) return;
        pdf.save(name);
        if (k === 'wa') window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n(PDF attached)'), '_blank', 'noopener');
        if (k === 'mail') location.href = `mailto:?subject=${encodeURIComponent(name.replace(/\.pdf$/, '') + ' - ' + BRAND.name)}&body=${encodeURIComponent(text + '\n\nPlease find the PDF attached.\n\nRegards,\n' + BRAND.name)}`;
        if (k !== 'dl') toast('PDF downloaded. Please attach it to your message.');
        m.remove();
      });
      setTimeout(() => document.addEventListener('click', () => m.remove(), {once: true}), 0);
    } catch (err) { toast('Could not share: ' + nice(err), true); }
    finally { btn.disabled = false; btn.textContent = old; }
  });
}

/* ============================== WhatsApp ==============================
   The current PDF is uploaded to the public certs bucket
   under s/<record id>.pdf. The id is a random UUID, so only people with the link can open it. */
const WA_TYPES = {quotation: 'Quotation', invoice: 'Tax Invoice', receipt: 'Cash Receipt', dn: 'Delivery Note', jobcard: 'Job Card', po: 'Purchase Order'};
const WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14"/><path d="M21 3l-6.5 18-3.5-7-7-3.5z"/></svg>';
const waNum = s => { let d = String(s || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2);
  if (/^05\d{8}$/.test(d)) d = '966' + d.slice(1); else if (/^5\d{8}$/.test(d)) d = '966' + d; return d; };
const waMemo = {
  get: p => { try { return JSON.parse(localStorage.getItem('docs.wa.numbers') || '{}')[String(p || '').trim().toLowerCase()] || ''; } catch (e) { return ''; } },
  set: (p, n) => { try { const m = JSON.parse(localStorage.getItem('docs.wa.numbers') || '{}'); m[String(p || '').trim().toLowerCase()] = n; localStorage.setItem('docs.wa.numbers', JSON.stringify(m)); } catch (e) {} }
};
const shareUrl = id => certUrl(`s/${id}`);
async function waLink(type, rec, makePdf) {
  const pdf = await makePdf();
  const {error} = await sb.storage.from(CERT_BUCKET).upload(`s/${rec.id}.pdf`, pdf.output('blob'), {contentType: 'application/pdf', upsert: true, cacheControl: '60'});
  if (error) throw new Error('Could not create the PDF link: ' + nice(error));
  return shareUrl(rec.id);
}
function waText(type, r, link) {
  const d = r.data || {}, hi = '', sign = BRAND.signature;
  const money2 = n => Number(n || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  if (type === 'quotation') return hi + `Please find our Quotation ${r.doc_no}` + (r.party_name ? ` for ${r.party_name}` : '') + '.'
    + (d.grand_total ? `\nTotal: SAR ${money2(d.grand_total)} (incl. VAT)` : '') + (d.validity ? `\nValid for: ${d.validity}` : '') + `\n\nQuotation (PDF):\n${link}` + sign;
  if (type === 'invoice') return hi + `Please find Tax Invoice ${r.doc_no}` + (r.party_name ? ` for ${r.party_name}` : '') + '.'
    + (d.grand_total ? `\nAmount: SAR ${money2(d.grand_total)}` : '') + (d.due_date ? `\nDue date: ${fmtDate(d.due_date)}` : '') + `\n\nInvoice (PDF):\n${link}` + sign;
  if (type === 'receipt') return hi + `Thank you for your payment. Please find Cash Receipt ${r.doc_no}` + (d.amount ? ` for SAR ${money2(d.amount)}` : '') + '.'
    + (d.invoice_no ? `\nAgainst invoice: ${d.invoice_no}` : '') + `\n\nReceipt (PDF):\n${link}` + sign;
  if (type === 'po') return hi + `Please find Purchase Order ${r.doc_no}` + (d.delivery_date ? `, needed by ${fmtDate(d.delivery_date)}` : '') + '.'
    + (d.grand_total ? `\nTotal: SAR ${money2(d.grand_total)}` : '') + `\n\nPurchase order (PDF):\n${link}` + sign;
  if (type === 'dn') return hi + `Please find Delivery Note ${r.doc_no}` + (r.party_name ? ` for ${r.party_name}` : '') + '.'
    + (d.po_no ? `\nPO No.: ${d.po_no}` : '') + (d.truck_no ? `\nVehicle No.: ${d.truck_no}` : '') + `\n\nDelivery note (PDF):\n${link}` + sign;
  return hi + `Please find Job Card ${r.doc_no}` + (r.party_name ? ` for ${r.party_name}` : '') + '.'
    + (d.equipment ? `\nEquipment: ${d.equipment}` : '') + (d.job_status ? `\nStatus: ${d.job_status}` : '') + `\n\nJob card (PDF):\n${link}` + sign;
}
async function sendWhatsApp(type, rec, makePdf) {
  const link = await waLink(type, rec, makePdf), text = waText(type, rec, link);
  document.getElementById('waDlg')?.remove();
  const dl = document.createElement('dialog'); dl.id = 'waDlg'; dl.className = 'wa-dlg';
  dl.innerHTML = `<form method="dialog">
      <div class="wa-h"><b>Send ${esc(rec.doc_no)} on WhatsApp</b><button class="x" value="close" aria-label="Close">&times;</button></div>
      <div class="field"><label for="wa_no">Customer mobile</label><input id="wa_no" type="tel" inputmode="tel" autocomplete="off" placeholder="05XXXXXXXX (optional)" value="${esc(waMemo.get(rec.party_name))}">
        <div class="hint">Leave it empty to pick the contact inside WhatsApp. The number is remembered for ${esc(rec.party_name || 'this customer')} on this device.</div></div>
      <div class="field"><label for="wa_msg">Message</label><textarea id="wa_msg">${esc(text)}</textarea></div>
      <div class="wa-link">Link: <a href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a></div>
      <p class="wa-err" id="wa_err" role="alert"></p>
      <div class="wa-acts"><button type="button" class="btn wa" id="wa_go">${WA_ICON}Open WhatsApp</button><button type="button" class="btn sec" id="wa_copy">Copy message</button></div>
    </form>`;
  document.body.appendChild(dl); dl.showModal();
  dl.addEventListener('close', () => dl.remove());
  dl.querySelector('#wa_go').onclick = () => {
    const raw = dl.querySelector('#wa_no').value.trim(), n = waNum(raw);
    if (raw && n.length < 11) { dl.querySelector('#wa_err').textContent = 'Please check the mobile number, e.g. 0551234567 or +966551234567.'; return; }
    waMemo.set(rec.party_name, raw);
    window.open(`https://wa.me/${n}?text=${encodeURIComponent(dl.querySelector('#wa_msg').value)}`, '_blank', 'noopener');
    dl.close();
  };
  dl.querySelector('#wa_copy').onclick = async () => {
    const ta = dl.querySelector('#wa_msg');
    try { await navigator.clipboard.writeText(ta.value); toast('Message copied'); } catch (e) { ta.select(); document.execCommand('copy'); toast('Message copied'); }
  };
}
async function waClick(btn, type, rec, makePdf, inForm) {
  if (!rec?.id) { toast('Save the document first, then send it on WhatsApp.', true); return; }
  if (inForm && dirty && !confirm('You have unsaved changes. The customer will get the last saved version. Continue?')) return;
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = 'Please wait…';
  try { await sendWhatsApp(type, rec, makePdf); } catch (err) { toast(nice(err), true); }
  finally { btn.disabled = false; btn.innerHTML = old; }
}
const waBtn = (type, id) => WA_TYPES[type] ? `<button class="btn small wa" data-wa="${id}" title="Send on WhatsApp" aria-label="Send on WhatsApp">${WA_ICON}</button>` : '';
const waFormBtn = type => WA_TYPES[type] ? `<button class="btn wa" type="button" id="wa">${WA_ICON}WhatsApp</button>` : '';

/* Invoice payments */
const PAY_LABEL = {paid: 'Paid', partial: 'Partially paid', unpaid: 'Unpaid', overdue: 'Overdue'};
function payState(total, paid, due) {
  const bal = r2((Number(total) || 0) - (Number(paid) || 0));
  if (bal <= 0.005) return 'paid';
  if (due && due < today()) return 'overdue';
  return paid > 0.005 ? 'partial' : 'unpaid';
}
async function paymentsFor(ids) {
  if (!ids.length) return {};
  const {data, error} = await sb.from('docs_payments').select('document_id, amount').in('document_id', ids);
  if (error) return null;           // table not there yet (SQL not run)
  const m = {}; data.forEach(p => m[p.document_id] = r2((m[p.document_id] || 0) + Number(p.amount))); return m;
}

/* ============================== draft / approve ============================== */
const statusPill = r => r?.status === 'approved' ? '<span class="res PASS">Approved</span>' : '<span class="res draft">Draft</span>';
const locked = rec => rec?.status === 'approved' && ROLE !== 'manager';     // approved documents: only a manager can change them
function approvalButtons(rec) {
  if (!rec) return '';
  if (ROLE !== 'manager') return '';
  return rec.status === 'approved' ? '<button class="btn sec" type="button" id="reopen">Reopen as draft</button>'
                                   : '<button class="btn" type="button" id="approve" style="background:var(--green)">Approve</button>';
}
async function approvalLine(rec) {
  if (!rec) return '';
  return rec.status === 'approved'

function words(n) {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen',
             'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const t = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const chunk = x => {
    const out = [];
    if (x >= 100) { out.push(a[Math.floor(x / 100)] + ' Hundred'); x %= 100; }
    if (x >= 20) out.push(t[Math.floor(x / 10)] + (x % 10 ? '-' + a[x % 10] : ''));
    else if (x) out.push(a[x]);
    return out.join(' ');
  };
  if (!n) return 'Zero';
  const out = [];
  for (const [u, name] of [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']]) if (n >= u) { out.push(chunk(Math.floor(n / u)) + ' ' + name); n %= u; }
  if (n) out.push(chunk(n));
  return out.join(' ');
}
const sarWords = total => { const h = Math.round(total * 100), r = Math.floor(h / 100), hal = h % 100;
  return `Saudi Riyals ${words(r)}${hal ? ` and ${words(hal)} Halalas` : ''} Only`; };
// amount in Arabic words (تفقيط): فقط ألف ومائتان وخمسون ريال سعودي لا غير
function arNum(n) {
  const U = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
  const T = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
  const H = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
  const small = x => { const h = Math.floor(x / 100), r = x % 100, p = []; if (h) p.push(H[h]);
    if (r) p.push(r < 20 ? U[r] : (r % 10 ? U[r % 10] + ' و' + T[Math.floor(r / 10)] : T[Math.floor(r / 10)])); return p.join(' و'); };
  const scale = (x, one, two, few, many) => x === 1 ? one : x === 2 ? two : x <= 10 ? small(x) + ' ' + few : small(x) + ' ' + many;
  if (!n) return 'صفر';
  const m = Math.floor(n / 1e6), th = Math.floor(n % 1e6 / 1000), r = n % 1000, out = [];
  if (m) out.push(scale(m, 'مليون', 'مليونان', 'ملايين', 'مليون'));
  if (th) out.push(scale(th, 'ألف', 'ألفان', 'آلاف', 'ألف'));
  if (r) out.push(small(r));
  return out.join(' و');
}
const sarWordsAr = total => { const h = Math.round(total * 100), r = Math.floor(h / 100), hal = h % 100;
  return `فقط ${arNum(r)} ريال سعودي${hal ? ` و${arNum(hal)} هللة` : ''} لا غير`; };

function quoteTotals(items) {
  let sub = 0, vat = 0;
  const rows = items.map(it => {
    const line = num(it.qty) * num(it.rate);
    const tp = String(it.tax_pct ?? '').trim() === '' ? 15 : num(it.tax_pct);
    const v = line * tp / 100; sub += line; vat += v;
    return {...it, tp, vat: v, amount: line + v};
  });
  return {rows, sub: r2(sub), vat: r2(vat), total: r2(sub + vat)};
}

  };

    section(s.title); kv(s.fields.filter(([k]) => !s.optional || String(d[k] || '').trim()).map(([k, l, t]) => [l, t === 'date' ? fmtDate(d[k]) : d[k]]), 1); });
  T.notes.forEach(([k, l]) => { if (String(d[k] || '').trim()) { section(l); kv([[l === 'Notes' ? 'Notes' : 'Remarks', d[k]]], 1); } });
  if (T.money) {
    // quotation / invoice: bank details on the left, stamp + signature on the right of the same band
    need(40);
    const y0 = y;
    const bankW = T.zatca ? 88 : 112;
    if (type === 'quotation' || type === 'invoice') { section('Bank Details', bankW); kv(BANK, 1, bankW); }
    if (T.zatca) {
      drawQr(pdf, zatcaQr(r), M + bankW + 4, y0 + 2, 30);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(...C.muted);
      pdf.text('ZATCA QR', M + bankW + 19, y0 + 35, {align: 'center'});
    }

    const sy = Math.max(y, y0 + 36);

    pdf.setDrawColor(...C.ink); pdf.setLineWidth(0.35); pdf.line(x, sy, x + 62, sy);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5); pdf.setTextColor(...C.slate);
    pdf.text('Authorized Signature', x + 31, sy + 4.5, {align: 'center'});
    y = sy + 8;
  }

  // signature lines at the bottom of the last page (delivery note, job card, material request)
  if (T.signs) {
    if (y + 26 > BOTTOM) newPage();
    const sy = BOTTOM - 8;
    pdf.setDrawColor(...C.ink); pdf.setLineWidth(0.35);
    const w = (CW - 20) / 3;
    T.signs.forEach((t, i) => {
      const x = M + i * (w + 10);
      pdf.line(x, sy, x + w, sy);
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5); pdf.setTextColor(...C.slate);
      pdf.text(t, x, sy + 4.5);

  for (let i = 1; i <= n; i++) {
    pdf.setPage(i); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(...C.muted);
    pdf.text(`${r.doc_no || 'DRAFT'}   |   Page ${i} of ${n}`, W - M, BOTTOM + 4.5, {align: 'right'});
  }

}
const SELLER_AR = BRAND.nameAr;
function zatcaQr(r) {
  const d = r.data || {}, enc = new TextEncoder();
  const fields = [SELLER_AR, VAT_NO, `${r.doc_date || today()}T12:00:00Z`, Number(d.grand_total || 0).toFixed(2), Number(d.vat_total || 0).toFixed(2)];
  const bytes = [];
  fields.forEach((v, i) => { const b = enc.encode(v); bytes.push(i + 1, b.length, ...b); });
  return btoa(String.fromCharCode(...bytes));
}

const AR_FONT = '"Noto Naskh Arabic", "Segoe UI", Tahoma, Arial, sans-serif';
async function arabicReady() { try { await Promise.all([document.fonts.load(`400 20px ${AR_FONT}`, 'شركة'), document.fonts.load(`700 20px ${AR_FONT}`, 'شركة')]); } catch (e) {} }

function arImg(text, pt, {color = '#000', bold = false, maxW = null} = {}) {

    lines.push(cur);

        else { pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.6); pdf.setTextColor(...C.ink);
          const ls = pdf.splitTextToSize(s, vw).slice(0, 2); pdf.text(ls, x + LW + 2, d.y + RH / 2 + 1.2 - (ls.length - 1) * 1.8); }

let CUSTS = null;
async function loadCustomers(force) {

const custKey = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');

// on any customer form: suggest customers from the list and fill in their details when one is picked
async function wireCustomer(type) {

  const have = new Set([...dl.options].map(o => custKey(o.value)));

  dl.insertAdjacentHTML('afterbegin', opts.filter(([n]) => !have.has(custKey(n))).map(([n, c]) => `<option value="${esc(n)}" label="${esc([c.code, n === c.name ? c.name_ar : c.name].filter(Boolean).join(' · '))}">`).join(''));
  const hint = document.createElement('div'); hint.className = 'hint'; hint.id = 'custHint'; inp.closest('.field').appendChild(hint);
  const show = c => { hint.innerHTML = c ? `Customer list: <b>${esc(c.code || '')}</b>${c.vat_no ? ` · VAT ${esc(c.vat_no)}` : ''}${c.mobile || c.phone ? ` · ${esc(c.mobile || c.phone)}` : ''}${c.payment_terms ? ` · ${esc(c.payment_terms)}` : ''}` : ''; };
  const fill = () => {
    const c = findCustomer(inp.value); show(c); if (!c) return;

    put('f_customer_address', c.address || c.address_ar); put('f_customer_trn', c.vat_no); put('f_customer_id', c.code);

}

    contact_person: [v('Salutation'), v('First Name'), v('Last Name')].filter(Boolean).join(' ') || null, phone: v('Phone') || v('Billing Phone') || null, mobile: v('MobilePhone') || null,
    email: v('EmailID') || null, vat_no: v('Tax Registration Number') || null, buyer_id: v('Buyer ID Value') ? `${v('Buyer ID Label') || 'ID'} ${v('Buyer ID Value')}` : null,

async function showCustomers() {
  const seq = ROUTE_SEQ;
  view.innerHTML = '<div class="ah-skel" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  const list = await loadCustomers(true);
  if (seq !== ROUTE_SEQ) return;
  if (list.error) { view.innerHTML = `<p class="flash">The customer list is not set up yet: run the latest <b>supabase_docs.sql</b> in Supabase. (${esc(nice(list.error))})</p>`; return; }
  view.innerHTML = `
    <div class="tools">
      <div class="field"><label for="q">Search</label><input id="q" type="search" placeholder="Name, number, VAT, city, phone"></div>
      <div class="field"><label for="cs">Show</label><select id="cs" data-remember="docs.cust.show"><option value="active">Active</option><option value="all">All</option><option value="inactive">Inactive</option></select></div>
      <span style="flex:1"></span>
      ${CAN_EDIT ? '<label class="btn sec" for="zimp" style="cursor:pointer">Import from Zoho (Excel)</label><input type="file" id="zimp" accept=".xlsx,.xls,.csv" hidden><a class="btn" href="#customers/new">+ New customer</a>' : ''}
    </div>
    <p class="hint" id="impMsg" style="margin-top:-6px">${list.length} customers. ${CAN_EDIT ? 'In Zoho Books: Sales → Customers → ⋮ → Export Customers (XLSX), then import that file here. Importing again updates existing customers and adds new ones.' : ''}</p>
    <div class="table-wrap"><table><thead><tr><th>No.</th><th>Customer</th><th>VAT No.</th><th>Mobile / phone</th><th>City</th><th>Payment terms</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="muted" id="count" style="font-size:13px"></p>`;
  const draw = () => {
    const q = custKey($('#q').value), st = $('#cs').value;
    const rows = list.filter(c => (st === 'all' || (st === 'active' ? c.active : !c.active)) && (!q || custKey([c.code, c.name, c.name_ar, c.vat_no, c.city, c.mobile, c.phone, c.email, c.contact_person].join(' ')).includes(q)));
    $('#rows').innerHTML = rows.length ? rows.map(c => `<tr class="click" data-id="${c.id}"><td class="no">${esc(c.code || '')}</td>
      <td>${who(c.name)}${c.name_ar && c.name_ar !== c.name ? `<div class="sub" dir="rtl" lang="ar" style="text-align:left">${esc(c.name_ar)}</div>` : ''}</td>
      <td class="mono" style="white-space:nowrap">${esc(c.vat_no || '')}</td><td style="white-space:nowrap">${esc(c.mobile || c.phone || '')}</td><td>${esc(c.city || '')}</td><td style="white-space:nowrap">${esc(c.payment_terms || '')}</td>
      <td>${c.active ? '<span class="res PASS">Active</span>' : '<span class="res draft">Inactive</span>'}</td></tr>`).join('')
      : `<tr><td colspan="7" class="empty">${list.length ? 'No customer matches this search.' : 'No customers yet.' + (CAN_EDIT ? ' Import the Zoho Books customer export above, or <a href="#customers/new">+ Add the first customer</a>' : '')}</td></tr>`;
    $('#count').textContent = list.length ? `${rows.length} of ${list.length}` : '';
  };
  $('#q').addEventListener('input', draw); $('#cs').addEventListener('change', draw); draw();
  $('#rows').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) location.hash = '#customers/' + tr.dataset.id; });
  $('#zimp')?.addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    const msg = $('#impMsg'); msg.textContent = 'Reading the file…';
    try {
      if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => no(new Error('Could not load the Excel reader. Check the internet connection.')); document.head.appendChild(s); });
      const wb = XLSX.read(await file.arrayBuffer(), {type: 'array'}), ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {defval: '', raw: false});
      if (!raw.length || !('Display Name' in raw[0])) throw new Error('This does not look like the Zoho Books customer export (no "Display Name" column).');
      const rows = raw.filter(r => String(r['Contact Type'] || 'customer').toLowerCase() !== 'vendor').map(zohoToCustomer).filter(c => c.name);
      const byZoho = Object.fromEntries(list.filter(c => c.zoho_id).map(c => [c.zoho_id, c])), byCode = Object.fromEntries(list.filter(c => c.code).map(c => [c.code, c]));
      let added = 0, updated = 0;
      const out = rows.map(c => { const ex = (c.zoho_id && byZoho[c.zoho_id]) || (c.code && byCode[c.code]);
        if (!ex) { added++; return c; }
        updated++; const m = {...c, id: ex.id};                     // keep details typed in the portal when Zoho has nothing
        Object.keys(c).forEach(k => { if ((c[k] === null || c[k] === '') && ex[k]) m[k] = ex[k]; });
        return {...m, updated_at: new Date().toISOString()}; });
      msg.textContent = `Saving ${out.length} customers…`;
      const news = out.filter(c => !c.id), olds = out.filter(c => c.id);
      for (let i = 0; i < news.length; i += 200) { const {error} = await sb.from('docs_customers').insert(news.slice(i, i + 200)); if (error) throw error; }
      for (let i = 0; i < olds.length; i += 200) { const {error} = await sb.from('docs_customers').upsert(olds.slice(i, i + 200), {onConflict: 'id'}); if (error) throw error; }
      toast(`Customers imported: ${added} new, ${updated} updated`); CUSTS = null; showCustomers();
    } catch (err) { msg.textContent = ''; toast('Import failed: ' + nice(err), true); }
  });
}
async function showCustomerForm(id) {
  const seq = ROUTE_SEQ;
  await loadCustomers(true);
  if (CUSTS.error) { view.innerHTML = `<p class="flash">Run the latest <b>supabase_docs.sql</b> in Supabase first.</p>`; return; }
  const c = id ? CUSTS.find(x => x.id === id) : {active: true};
  if (!c) { view.innerHTML = '<p class="flash">Customer not found. <a href="#customers">Back to list</a></p>'; return; }
  const ro = !CAN_EDIT, dis = ro ? 'disabled' : '';
  let docs = [];
  if (id) { const names = [c.name, c.name_ar].filter(Boolean); const {data} = await sb.from('docs_documents').select('id, doc_type, doc_no, doc_date, status').in('party_name', names).order('doc_date', {ascending: false}).limit(30); docs = data || []; }
  if (seq !== ROUTE_SEQ) return;
  const DN = window.portalDocNames || {};
  view.innerHTML = `
    <p style="margin:0 0 10px"><a href="#customers">&larr; Customers</a></p>
    <h2>${id ? esc(c.name) : 'New customer'}</h2>
    ${c.name_ar && c.name_ar !== c.name ? `<p class="meta" dir="rtl" lang="ar" style="text-align:left">${esc(c.name_ar)}</p>` : ''}
    <form id="f" autocomplete="off">
      <div class="sheet">
        <h3>Customer</h3>
        <div class="grid">${CUST_F.map(([k, l]) => `<div class="field"><label for="c_${k}">${l}</label><input id="c_${k}" value="${esc(c[k] || '')}" ${k === 'name' ? 'required' : ''} ${k === 'name_ar' ? 'dir="rtl" lang="ar"' : ''} ${dis}></div>`).join('')}
          <label class="field" style="flex-direction:row;align-items:center;gap:8px;display:flex"><input type="checkbox" id="c_active"${c.active ? ' checked' : ''} ${dis} style="width:auto"> Active (shown in suggestions)</label></div>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
          <div class="field"><label for="c_address">Address (English)</label><textarea id="c_address" rows="3" ${dis}>${esc(c.address || '')}</textarea></div>
          <div class="field"><label for="c_address_ar">Address (Arabic)</label><textarea id="c_address_ar" rows="3" dir="rtl" lang="ar" ${dis}>${esc(c.address_ar || '')}</textarea></div>
        </div>
        <div class="field"><label for="c_notes">Notes</label><input id="c_notes" value="${esc(c.notes || '')}" ${dis}></div>
        ${c.zoho_id ? '<p class="hint">Imported from Zoho Books. A new import updates it; details you add here are kept when Zoho has them empty.</p>' : ''}
      </div>
      ${id ? `<div class="sheet"><h3>Documents for this customer</h3>${docs.length ? `<div class="table-wrap" style="box-shadow:none;border:1px solid var(--border)"><table><thead><tr><th>No.</th><th>Type</th><th>Date</th><th>Status</th></tr></thead><tbody>
        ${docs.map(d => `<tr class="click" data-href="#${d.doc_type}/${d.id}"><td class="no">${esc(d.doc_no)}</td><td>${esc(DN[d.doc_type] || d.doc_type)}</td><td>${esc(fmtDate(d.doc_date))}</td><td>${statusPill(d)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No documents yet.</p>'}</div>` : ''}
      <p class="err" id="err" role="alert"></p>
      <div class="bar">
        ${ro ? '' : '<button class="btn" id="save" type="submit">Save</button>'}
        <span class="grow"></span>
        ${id && CAN_DELETE ? '<button class="btn danger" type="button" id="del">Delete</button>' : ''}
      </div>
    </form>`;
  const form = $('#f');
  form.addEventListener('input', () => { dirty = true; });
  view.querySelectorAll('tr[data-href]').forEach(tr => tr.onclick = () => { location.hash = tr.dataset.href; });
  $('#del')?.addEventListener('click', async () => { if (!confirm(`Delete ${c.name}? Documents already made for this customer are not changed.`)) return;
    const {error} = await sb.from('docs_customers').delete().eq('id', id); if (error) { $('#err').textContent = nice(error); return; }
    dirty = false; CUSTS = null; toast('Customer deleted'); location.hash = '#customers'; });
  form.addEventListener('submit', async e => { e.preventDefault(); if (ro) return;
    const v = Object.fromEntries(CUST_F.map(([k]) => [k, $('#c_' + k).value.trim() || null]));
    Object.assign(v, {address: $('#c_address').value.trim() || null, address_ar: $('#c_address_ar').value.trim() || null, notes: $('#c_notes').value.trim() || null, active: $('#c_active').checked});
    if (!v.name) { $('#err').textContent = 'Please enter the customer name.'; return; }
    const res = id ? await sb.from('docs_customers').update({...v, updated_at: new Date().toISOString()}).eq('id', id).select().single() : await sb.from('docs_customers').insert(v).select().single();
    if (res.error) { $('#err').textContent = res.error.code === '23505' ? 'This customer number already exists.' : nice(res.error); return; }
    dirty = false; CUSTS = null; toast(`${v.name} saved`); location.hash = '#customers/' + res.data.id;
  });
}

/* ===================== CASH RECEIPT (سند قبض) ===================== */
// Money received from a customer. Can be linked to an invoice: the payment is then recorded on that invoice too.
const RCPT_METHODS = ['Cash', 'Cheque', 'Bank transfer', 'Card'];
IDOCS.receipt = {
  title: 'Cash Receipt', plural: 'Cash Receipts', group: 'customer', custom: true,
  nextNo: (list, date) => { const y = (date || today()).slice(0, 4); return `CR-${y}-${String(maxNo(list, new RegExp(`^CR-${y}-(\\d+)$`)) + 1).padStart(3, '0')}`; },
  party: [],
  listCols: [['Received from', r => who(r.party_name)], ['Method', r => esc(r.data?.method)], ['Invoice', r => esc(r.data?.invoice_no)], ['Amount (SAR)', r => money(r.data?.amount), 'money']],
  search: r => [r.data?.invoice_no, r.data?.purpose, r.data?.reference, r.data?.method]
};

function receiptPdf(r, img) {
  const d = r.data || {};
  const {jsPDF} = window.jspdf;
  const pdf = new jsPDF({unit: 'mm', format: 'a4', compress: true});
  const W = 210, M = 12, CW = W - 2 * M, hh = CW * img.header.h / img.header.w;
  const ar = (t, x, y, pt, o = {}) => { const a = arImg(t, pt, o); pdf.addImage(a.dataUrl, 'PNG', o.left ? x : x - a.w, y - a.h / 2, a.w, a.h); return a; };
  const amount = Number(d.amount) || 0;
  const half = (y0, label) => {
    pdf.addImage(img.header.dataUrl, 'JPEG', M, y0, CW, hh, 'hdr');
    let y = y0 + hh + 7;
    // title + copy label
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(16); pdf.setTextColor(...C.slate);
    pdf.text('CASH RECEIPT', M, y + 2);
    ar('سند قبض', M + pdf.getTextWidth('CASH RECEIPT') + 5, y + 0.6, 14, {left: true, color: '#2E5868', bold: true});
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.setTextColor(...C.muted);
    pdf.text(label + `   |   VAT No: ${VAT_NO}`, M, y + 7.5);
    // amount box
    const bw = 62, bx = W - M - bw;
    pdf.setDrawColor(...C.slate); pdf.setLineWidth(0.6); pdf.roundedRect(bx, y - 6, bw, 15, 1.5, 1.5, 'S');
    pdf.setFillColor(...C.slate); pdf.roundedRect(bx, y - 6, 16, 15, 1.5, 1.5, 'F'); pdf.rect(bx + 8, y - 6, 8, 15, 'F');
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(255, 255, 255); pdf.text('SAR', bx + 8, y + 2.8, {align: 'center'});
    pdf.setFontSize(15); pdf.setTextColor(...C.ink); pdf.text(money(amount), bx + bw - 3, y + 3.4, {align: 'right'});
    y += 14;
    // no. and date
    pdf.setDrawColor(...C.line); pdf.setLineWidth(0.25); pdf.line(M, y, W - M, y);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.setTextColor(...C.ink);
    pdf.text('Receipt No.', M, y + 6); pdf.setTextColor(...RED); pdf.setFontSize(10.5); pdf.text(r.doc_no || 'DRAFT', M + 23, y + 6);
    ar('رقم السند', M + 80, y + 5.2, 8.5);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.setTextColor(...C.ink); pdf.text('Date', W / 2 + 6, y + 6);
    pdf.setFont('helvetica', 'normal'); pdf.text(fullDate(r.doc_date), W / 2 + 18, y + 6);
    ar('التاريخ', W - M, y + 5.2, 8.5);
    y += 10;
    // lines: English label | value | Arabic label
    const line = (en, arTxt, value, h = 10) => {
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.setTextColor(...C.slate); pdf.text(en, M, y + 6);
      const aw = ar(arTxt, W - M, y + 5.2, 9).w;
      const x0 = M + 40, x1 = W - M - aw - 4;
      pdf.setDrawColor(...C.line); pdf.setLineDashPattern([0.6, 0.9], 0); pdf.line(x0, y + 7.6, x1, y + 7.6); pdf.setLineDashPattern([], 0);
      const v = String(value || '').trim() || '-';
      if (hasAr(v)) { const a = arImg(v, 10, {maxW: x1 - x0 - 2, bold: true}); const k = Math.min(1, 8 / a.h); pdf.addImage(a.dataUrl, 'PNG', x0 + 1, y + 6 - a.h * k + 1.6, a.w * k, a.h * k); }
      else { pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.setTextColor(...C.ink); pdf.text(pdf.splitTextToSize(v, x1 - x0 - 2)[0], x0 + 1, y + 6); }
      y += h;
    };
    line('Received from', 'استلمنا من السيد / السادة', r.party_name, 9);
    line('The sum of', 'مبلغ وقدره', sarWords(amount), 7.5);
    { const x0 = M + 40, x1 = W - M - 34, a = arImg(sarWordsAr(amount), 9.5, {bold: true, maxW: x1 - x0}); const k = Math.min(1, 6.5 / a.h);
      pdf.addImage(a.dataUrl, 'PNG', x1 - a.w * k, y + 4.2 - a.h * k / 2, a.w * k, a.h * k); y += 8; }
    line('Being', 'وذلك عن', [[d.purpose, d.invoice_no && `against invoice ${d.invoice_no}`].filter(Boolean).join(', '), d.purpose_ar].filter(Boolean).join('  /  '), 9);
    line('Paid by', 'طريقة الدفع', [`${d.method || ''}${METHOD_AR[d.method] ? ` (${METHOD_AR[d.method]})` : ''}`, d.reference && `No. ${d.reference}`, d.bank].filter(Boolean).join(', '), 9);
    // what was due, and what is still due after this receipt
    const due = Number(d.due_total) || 0;
    if (due > 0) {
      const before = Number(d.paid_before) || 0, bal = r2(due - before - amount);
      const cells = [['Total due', 'المبلغ المستحق', due], ...(before > 0.005 ? [['Paid before', 'المدفوع سابقاً', before]] : []), ['This receipt', 'هذا السند', amount], [bal >= -0.005 ? 'Balance due' : 'Overpaid', bal >= -0.005 ? 'المتبقي' : 'زيادة', Math.abs(bal)]];
      const cw = CW / cells.length; y += 2;
      cells.forEach(([en, a2, v], i) => { const x = M + i * cw, last = i === cells.length - 1;
        pdf.setFillColor(...(last ? (bal > 0.005 ? [253, 238, 232] : [232, 245, 236]) : LIGHT)); pdf.rect(x + (i ? 0.6 : 0), y, cw - 0.6, 11, 'F');
        pdf.setFont('helvetica', 'bold'); pdf.setFontSize(7.4); pdf.setTextColor(...C.slate); pdf.text(en, x + 2.5, y + 4);
        ar(a2, x + cw - 2.5, y + 3.4, 7.4, {color: '#2E5868'});
        pdf.setFontSize(10.5); pdf.setTextColor(...(last && bal > 0.005 ? C.red : C.ink)); pdf.text('SAR ' + money(v), x + 2.5, y + 9.2); });
      y += 12;
    }
    // signatures + stamp
    y += due > 0 ? 9 : 14;
    const sw = 46, sh = img.stamp.h * sw / img.stamp.w;
    pdf.addImage(img.stamp.dataUrl, 'PNG', W / 2 - sw / 2, y + 9 - sh, sw, sh, 'stamp');
    pdf.setDrawColor(...C.ink); pdf.setLineWidth(0.35); pdf.line(M, y + 6, M + 60, y + 6); pdf.line(W - M - 60, y + 6, W - M, y + 6);
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(8.5); pdf.setTextColor(...C.slate);
    pdf.text(`Received by (${BRAND.short})`, M, y + 10.5); ar('المستلم', M + 60, y + 10, 8.5);
    pdf.text('Paid by (Customer)', W - M - 60, y + 10.5); ar('الدافع', W - M, y + 10, 8.5);
  };
  half(6, 'Original');
  pdf.setDrawColor(...C.muted); pdf.setLineWidth(0.2); pdf.setLineDashPattern([2, 1.5], 0); pdf.line(4, 148.5, W - 4, 148.5); pdf.setLineDashPattern([], 0);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(...C.muted); pdf.text('cut here', W / 2, 147.3, {align: 'center'});
  half(154, 'Copy');
  return pdf;
}

async function showReceiptForm(id, copyFrom) {
  const seq = ROUTE_SEQ, type = 'receipt', T = IDOCS.receipt;
  view.innerHTML = '<div class="ah-skel" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  let list, invoices, others;
  try { [list, invoices, ...others] = await Promise.all([loadIList(type, true), loadIList('invoice', true), ...GROUP_TYPES('customer').filter(t => t !== type && t !== 'invoice').map(t => loadIList(t))]); others = others.flat(); }
  catch (e) { view.innerHTML = `<p class="flash">Database error: ${esc(nice(e))}</p>`; return; }
  let rec = null, src = null;
  if (id || copyFrom) {
    const {data} = await sb.from('docs_documents').select('*').eq('id', id || copyFrom).eq('doc_type', type).maybeSingle();
    if (!data) { view.innerHTML = `<p class="flash">Receipt not found. <a href="#receipt">Back to list</a></p>`; return; }
    src = data; if (id) rec = data;
  }
  const d = {method: 'Cash', ...(src?.data || {})};
  if (copyFrom) { delete d.payment_id; delete d.invoice_id; delete d.invoice_no; }
  const ro = !CAN_EDIT || locked(rec), dis = ro ? 'disabled' : '';
  const dateNow = rec?.doc_date || today(), stLine = await approvalLine(rec);
  const names = [...new Set([...list, ...invoices, ...others].map(x => x.party_name).filter(Boolean))].sort();

  const who = rec ? `Created by: ${esc(await nameOf(rec.created_by))} · ${new Date(rec.created_at).toLocaleString('en-GB', {dateStyle: 'medium', timeStyle: 'short'})}` : '';

  view.innerHTML = `

    ${who ? `<p class="meta">${who}</p>` : ''}${stLine ? `<p class="status-line">${stLine}</p>` : ''}
    <form id="f" autocomplete="off">
      <div class="sheet">
        <h3>Receipt</h3>
        <div class="grid">
          <div class="field"><label for="f_no">Receipt No.</label>${rec ? `<div class="fixed">${esc(rec.doc_no)}</div>` : `<input id="f_no" placeholder="Auto: ${esc(T.nextNo(list, dateNow))}" ${dis}>`}</div>
          <div class="field"><label for="f_date">Date</label><input id="f_date" type="date" required value="${esc(dateNow)}" ${dis}></div>
          <div class="field" style="grid-column:1/-1"><label for="f_party">Received from</label><input id="f_party" list="names" required value="${esc(src?.party_name)}" ${dis}>
            <datalist id="names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
          <div class="field"><label for="f_amount">Amount (SAR)</label><input id="f_amount" type="number" min="0.01" step="0.01" required value="${esc(d.amount)}" ${dis}></div>
          <div class="field"><label for="f_method">Paid by</label><select id="f_method" ${dis}>${RCPT_METHODS.map(m => `<option${m === d.method ? ' selected' : ''}>${m}</option>`).join('')}</select></div>
          <div class="field"><label for="f_reference">Cheque / transfer No.</label><input id="f_reference" value="${esc(d.reference)}" ${dis}></div>
          <div class="field"><label for="f_bank">Bank</label><input id="f_bank" value="${esc(d.bank)}" placeholder="e.g. Demo Bank" ${dis}></div>
        </div>
        <p class="hint" id="words"></p>
        <div class="grid">
          <div class="field"><label for="f_invoice">Against invoice (optional)</label><select id="f_invoice" ${dis}></select></div>
          <div class="field"><label for="f_purpose">Being (for)</label><input id="f_purpose" value="${esc(d.purpose)}" placeholder="e.g. Advance payment for order" ${dis}></div>
          <div class="field"><label for="f_purpose_ar">Being (Arabic, optional)</label><input id="f_purpose_ar" dir="rtl" lang="ar" value="${esc(d.purpose_ar)}" placeholder="مثال: دفعة مقدمة لتصنيع خزان" ${dis}></div>
          <div class="field" id="dueBox"><label for="f_due">Amount due before this receipt (SAR, optional)</label><input id="f_due" type="number" min="0" step="0.01" value="${esc(d.invoice_id ? '' : d.due_total)}" ${dis}></div>
        </div>
        <p class="hint" id="dueLine"></p>
        ${ro ? '' : '<p class="hint">Choose an invoice to record this money as a payment on it too (it then shows in that invoice&#39;s Payments and in Receivables).</p>'}
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="bar">
        ${ro ? '' : '<button class="btn" id="save" type="submit">Save</button><button class="btn sec" id="saveNew" type="button" title="Save, then start a new one">Save &amp; New</button>'}
        <button class="btn sec" type="button" id="dl">Download PDF</button>
        <button class="btn sec" type="button" id="pv">Preview</button>
        <span class="share"><button class="btn sec" type="button" id="sh">Share</button></span>
        ${rec && CAN_EDIT ? `<a class="btn sec" href="#receipt/copy/${rec.id}">Copy as new</a>` : ''}
        ${approvalButtons(rec)}
        <span class="grow"></span>
        ${rec && CAN_DELETE ? '<button class="btn danger" type="button" id="del">Delete</button>' : ''}
      </div>
    </form>`;
  wireApproval(rec, type);
  const form = $('#f');
  const drawInvoices = () => {
    const p = $('#f_party').value.trim().toLowerCase(), cur = $('#f_invoice').value || d.invoice_id;
    const opts = invoices.filter(i => i.id === cur || ((i.party_name || '').trim().toLowerCase() === p && bal(i) > 0.005));
    $('#f_invoice').innerHTML = `<option value="">Not linked to an invoice</option>` + opts.map(i => `<option value="${i.id}"${i.id === cur ? ' selected' : ''}>${esc(i.doc_no)}, balance SAR ${money(bal(i))}</option>`).join('');
  };
  const drawWords = () => { const a = Number($('#f_amount').value); $('#words').innerHTML = a > 0 ? `${esc(sarWords(a))}<br><span dir="rtl" lang="ar">${esc(sarWordsAr(a))}</span>` : ''; };
  const dueInfo = () => { const inv = invoices.find(i => i.id === $('#f_invoice').value), a = r2(Number($('#f_amount').value) || 0);
    if (inv) { const total = r2(Number(inv.data?.grand_total) || 0), before = r2(total - bal(inv)); return {due_total: total, paid_before: before, balance: r2(total - before - a)}; }
    const due = r2(Number($('#f_due').value) || 0); return due > 0 ? {due_total: due, paid_before: 0, balance: r2(due - a)} : {due_total: 0, paid_before: 0, balance: 0}; };
  const drawDue = () => { const linked = !!$('#f_invoice').value, x = dueInfo(); $('#dueBox').hidden = linked;
    $('#dueLine').innerHTML = x.due_total > 0 ? `Printed on the receipt: total due <b>SAR ${money(x.due_total)}</b>${x.paid_before ? `, paid before SAR ${money(x.paid_before)}` : ''}, this receipt SAR ${money(Number($('#f_amount').value) || 0)}, <b>${x.balance >= -0.005 ? 'balance due' : 'overpaid'} SAR ${money(Math.abs(x.balance))}</b>` : ''; };
  drawInvoices(); drawWords(); drawDue();
  form.addEventListener('input', e => { dirty = true; if (e.target.id === 'f_amount') drawWords(); if (['f_amount', 'f_due'].includes(e.target.id)) drawDue(); });
  $('#f_party').addEventListener('change', () => { drawInvoices(); drawDue(); });
  $('#f_invoice').addEventListener('change', drawDue);
  $('#f_invoice').addEventListener('change', () => { const inv = invoices.find(i => i.id === $('#f_invoice').value);
    if (inv && !$('#f_amount').value) { $('#f_amount').value = bal(inv).toFixed(2); drawWords(); }
    if (inv && !$('#f_purpose').value.trim()) $('#f_purpose').value = 'Payment';
  });
  const collect = () => { const inv = invoices.find(i => i.id === $('#f_invoice').value);
    return {doc_date: $('#f_date').value, party_name: $('#f_party').value.trim(), data: {amount: r2(Number($('#f_amount').value) || 0), method: $('#f_method').value,
      reference: $('#f_reference').value.trim(), bank: $('#f_bank').value.trim(), purpose: $('#f_purpose').value.trim(), purpose_ar: $('#f_purpose_ar').value.trim(),
      due_total: dueInfo().due_total, paid_before: dueInfo().paid_before,
      invoice_id: inv ? inv.id : null, invoice_no: inv ? inv.doc_no : null, payment_id: rec?.data?.payment_id || null}}; };
  const draft = () => ({...collect(), doc_no: rec?.doc_no || ($('#f_no')?.value.trim() || '')});
  const run = async (btn, fn) => { const t = btn.textContent; btn.disabled = true; btn.textContent = 'Please wait…'; $('#err').textContent = '';
    try { await fn(); } catch (e) { $('#err').textContent = nice(e); } btn.disabled = false; btn.textContent = t; };
  const name = () => (draft().doc_no || 'Cash-Receipt-DRAFT') + '.pdf';
  $('#dl').onclick = e => run(e.target, async () => (await iPdf(type, draft())).save(name()));
  wireShare($('#sh'), () => iPdf(type, draft()), name, () => { const v = draft(); return `Cash Receipt ${v.doc_no || ''} - ${v.party_name} - SAR ${money(v.data.amount)}`; });
  $('#pv').onclick = e => run(e.target, async () => { const w = window.open('', '_blank'); const url = (await iPdf(type, draft())).output('bloburl'); if (w) w.location = url; else location.href = url; });
  $('#del')?.addEventListener('click', e => run(e.target, async () => {
    if (!confirm(`Permanently delete ${rec.doc_no}?${rec.data?.payment_id ? ' Its payment on ' + rec.data.invoice_no + ' will be deleted too.' : ''}`)) return;
    if (rec.data?.payment_id) { const {error} = await sb.from('docs_payments').delete().eq('id', rec.data.payment_id); if (error) throw error; }
    const {error} = await sb.from('docs_documents').delete().eq('id', rec.id); if (error) throw error;
    ILIST.invoice = null; dirty = false; toast(rec.doc_no + ' deleted'); location.hash = '#receipt';
  }));
  form.addEventListener('submit', e => { e.preventDefault(); if (!ro) run($('#save'), async () => {
    const v = collect(), x = v.data, old = rec?.data || {};
    if (!v.doc_date) throw new Error('Please enter the date.');
    if (!v.party_name) { $('#f_party').focus(); throw new Error('Please enter who the money was received from.'); }
    if (!(x.amount > 0)) { $('#f_amount').focus(); throw new Error('Please enter the amount.'); }
    const linkChanged = old.payment_id && (old.invoice_id !== x.invoice_id || Number(old.amount) !== x.amount || rec.doc_date !== v.doc_date || old.method !== x.method);
    if (linkChanged && !CAN_DELETE) throw new Error('This receipt is recorded as a payment on ' + old.invoice_no + '. Only a manager can change its amount, date, method or invoice.');
    if (x.invoice_id && !old.payment_id) { const inv = invoices.find(i => i.id === x.invoice_id);
      if (inv && x.amount > bal(inv) + 0.005 && !confirm(`This is more than the invoice balance (SAR ${money(bal(inv))}). Save anyway?`)) return; }
    let res;
    if (rec) res = await sb.from('docs_documents').update(v).eq('id', rec.id).select().single();
    else { const manual = $('#f_no').value.trim(); res = await sb.from('docs_documents').insert({doc_type: type, ...v, ...(manual ? {doc_no: manual} : {})}).select().single(); }
    if (res.error) throw new Error(res.error.code === '23505' ? 'This number already exists. Leave it blank or enter a different one.' : nice(res.error));
    rec = res.data;
    // keep the invoice payment in step with the receipt
    let pid = old.payment_id || null;
    if (pid && (linkChanged || !x.invoice_id)) { const {error} = await sb.from('docs_payments').delete().eq('id', pid); if (error) throw error; pid = null; }
    if (x.invoice_id && !pid) {
      const {data: pay, error} = await sb.from('docs_payments').insert({document_id: x.invoice_id, paid_on: v.doc_date, amount: x.amount, method: x.method, reference: rec.doc_no}).select().single();
      if (error) throw new Error('Receipt saved, but the invoice payment could not be recorded: ' + nice(error));
      pid = pay.id;
    }
    if (pid !== (rec.data?.payment_id || null)) { const up = await sb.from('docs_documents').update({data: {...rec.data, payment_id: pid}}).eq('id', rec.id).select().single(); if (!up.error) rec = up.data; }
    ILIST.invoice = null; dirty = false; toast(`${rec.doc_no} saved`);
    goAfterSave(type, rec.id);
  }); });
}

/* ============================== invoice payments panel ============================== */
async function drawPayments(rec) {
  const box = $('#pays'); if (!box) return;
  const {data, error} = await sb.from('docs_payments').select('*').eq('document_id', rec.id).order('paid_on');
  if (error) { box.innerHTML = '<h3>Payments</h3><p class="flash">Payments table not found. Run the latest <b>supabase_docs.sql</b> in Supabase.</p>'; return; }
  const total = Number(rec.data?.grand_total) || 0, paid = r2(data.reduce((s, p) => s + Number(p.amount), 0)), bal = r2(total - paid);
  const st = payState(total, paid, rec.data?.due_date);
  const canAdd = CAN_EDIT, canDel = CAN_DELETE;
  box.innerHTML = `<h3>Payments <span class="res ${st}" style="margin-left:6px">${PAY_LABEL[st]}</span></h3>
    <div class="paybox"><div><b>${money(total)}</b><span>Invoice total (SAR)</span></div><div><b>${money(paid)}</b><span>Received</span></div>
      <div><b style="color:${bal > 0.005 ? 'var(--red)' : 'var(--green)'}">${money(Math.max(0, bal))}</b><span>Balance</span></div>
      <div><b>${esc(fmtDate(rec.data?.due_date) || '-')}</b><span>Due date</span></div></div>
    ${data.length ? `<div class="table-wrap" style="box-shadow:none;border:1px solid var(--border)"><table><thead><tr><th>Date</th><th style="text-align:right">Amount (SAR)</th><th>Method</th><th>Reference</th><th>Recorded by</th><th></th></tr></thead><tbody>
      ${(await Promise.all(data.map(async p => `<tr><td>${esc(fmtDate(p.paid_on))}</td><td class="money">${money(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}</td>
        <td>${esc(await nameOf(p.created_by))}</td><td>${canDel ? `<button type="button" class="btn small danger" data-delpay="${p.id}">Delete</button>` : ''}</td></tr>`))).join('')}
      </tbody></table></div>` : '<p class="muted" style="margin:0">No payments recorded yet.</p>'}
    ${canAdd && bal > 0.005 ? `<div class="payform">
      <div class="field"><label for="p_date">Payment date</label><input id="p_date" type="date" value="${today()}"></div>
      <div class="field"><label for="p_amt">Amount (SAR)</label><input id="p_amt" type="number" step="0.01" min="0.01" value="${bal.toFixed(2)}"></div>
      <div class="field"><label for="p_method">Method</label><select id="p_method"><option>Bank transfer</option><option>Cash</option><option>Cheque</option><option>Card</option></select></div>
      <div class="field"><label for="p_ref">Reference</label><input id="p_ref" placeholder="Transfer / cheque no."></div>
      <button type="button" class="btn" id="p_add">Record payment</button></div>` : ''}`;
  $('#p_add')?.addEventListener('click', async e => {
    const amt = Number($('#p_amt').value);
    if (!(amt > 0)) { toast('Please enter the amount.', true); return; }
    if (amt > bal + 0.005 && !confirm(`This is more than the balance (${money(bal)}). Record it anyway?`)) return;
    e.target.disabled = true;
    const {error: err} = await sb.from('docs_payments').insert({document_id: rec.id, paid_on: $('#p_date').value || today(), amount: r2(amt),
      method: $('#p_method').value, reference: $('#p_ref').value.trim() || null});
    if (err) { e.target.disabled = false; toast(nice(err), true); return; }
    ILIST.invoice = null; toast('Payment recorded'); drawPayments(rec);
  });
  box.querySelectorAll('[data-delpay]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete this payment?')) return;
    const {error: err} = await sb.from('docs_payments').delete().eq('id', b.dataset.delpay);
    if (err) { toast(nice(err), true); return; }
    ILIST.invoice = null; toast('Payment deleted'); drawPayments(rec);
  }));
}

/* receivables: what each customer still owes, by how late it is */
async function showReceivables() {
  const seq = ROUTE_SEQ;
  view.innerHTML = '<div class="ah-skel" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';
  let list; try { list = await loadIList('invoice', true); } catch (e) { view.innerHTML = `<p class="flash">Database error: ${esc(nice(e))}</p>`; return; }
  if (seq !== ROUTE_SEQ) return;
  const t = today(), days = d => Math.floor((new Date(t) - new Date(d)) / 864e5);
  const B = ['Not due', '1-30 days', '31-60 days', '61-90 days', '90+ days'];
  const by = {};
  list.forEach(r => {
    if (r.paid == null) return;
    const bal = r2((r.data?.grand_total || 0) - r.paid); if (bal <= 0.005) return;
    const due = r.data?.due_date || r.doc_date, late = days(due);
    const b = late <= 0 ? 0 : late <= 30 ? 1 : late <= 60 ? 2 : late <= 90 ? 3 : 4;
    const c = by[r.party_name || '-'] ||= {name: r.party_name || '-', b: [0, 0, 0, 0, 0], n: 0};
    c.b[b] = r2(c.b[b] + bal); c.n++;
  });
  const rows = Object.values(by).map(c => ({...c, total: r2(c.b.reduce((a, x) => a + x, 0))})).sort((a, b) => b.total - a.total);
  const tot = B.map((_, i) => r2(rows.reduce((a, c) => a + c.b[i], 0))), grand = r2(tot.reduce((a, x) => a + x, 0));
  view.innerHTML = `
    <div class="tools"><a class="btn sec" href="#invoice">&larr; Invoices</a><span style="flex:1"></span>
      ${rows.length ? '<button class="btn sec" id="csv">Excel (CSV) download</button>' : ''}</div>
    <div class="kpis" style="margin-bottom:16px">${[['Total receivable', grand, 'var(--teal)'], ['Not due yet', tot[0], 'var(--green)'], ['Overdue', r2(grand - tot[0]), 'var(--red)'], ['90+ days', tot[4], 'var(--orange)']]
      .map(([l, v, c]) => `<div class="kpi"><span><b style="color:${c}">SAR ${money(v)}</b><span>${l}</span></span></div>`).join('')}</div>
    ${list.length && list[0].paid == null ? '<p class="flash">Payments table not found. Run the latest <b>supabase_docs.sql</b> in Supabase.</p>' : ''}
    <div class="table-wrap"><table><thead><tr><th>Customer</th><th style="text-align:right">Invoices</th>${B.map(b => `<th style="text-align:right">${b}</th>`).join('')}<th style="text-align:right">Total (SAR)</th></tr></thead>
    <tbody>${rows.length ? rows.map(c => `<tr><td>${who(c.name)}</td><td class="money">${c.n}</td>${c.b.map((v, i) => `<td class="money"${i >= 3 && v ? ' style="color:var(--red);font-weight:600"' : ''}>${v ? money(v) : '-'}</td>`).join('')}<td class="money"><b>${money(c.total)}</b></td></tr>`).join('')
      : `<tr><td colspan="8" class="empty">No outstanding balances.</td></tr>`}</tbody>
    ${rows.length ? `<tfoot><tr><td><b>Total</b></td><td></td>${tot.map(v => `<td class="money"><b>${money(v)}</b></td>`).join('')}<td class="money"><b>${money(grand)}</b></td></tr></tfoot>` : ''}</table></div>
    <p class="muted" style="font-size:13px">Days are counted from the due date (or from the invoice date if there is no due date).</p>`;
  $('#csv')?.addEventListener('click', () => {
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    const lines = [['Customer', 'Invoices', ...B, 'Total'], ...rows.map(c => [c.name, c.n, ...c.b, c.total]), ['Total', '', ...tot, grand]].map(r => r.map(q).join(','));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type: 'text/csv'}));
    a.download = `receivables-${today()}.csv`; a.click();
  });
}

/* ============================== PRICE LIST (Category > Sub-category > Product) ============================== */
const CATALOG_TYPES = ['quotation', 'invoice'];
let CATALOG = null;
async function loadCatalog(force) {
  if (CATALOG && !force) return CATALOG;
  const {data, error} = await sb.from('docs_catalog').select('*').order('category').order('subcategory').order('name');
  if (error) throw error;
  data.sort((a, b) => (a.category + '\u0000' + a.subcategory + '\u0000' + a.name).localeCompare(b.category + '\u0000' + b.subcategory + '\u0000' + b.name));
  return CATALOG = data;
}
const uniq = a => [...new Set(a.filter(Boolean))];

async function wirePicker(items, redraw) {
  const box = $('#picker'); if (!box) return;
  let list;
  try { list = (await loadCatalog()).filter(c => c.active); } catch (e) { box.innerHTML = '<b>Price list not found. Run the latest supabase_docs.sql in Supabase.</b>'; return; }
  if (!list.length) { box.innerHTML = `<b>The price list is empty.</b><span class="muted" style="font-size:13px">Open the <a href="#catalog">Price List</a> to add products.</span>`; return; }
  box.innerHTML = `<b>Choose a product from the price list</b>
    <div class="field"><label for="pk_cat">Category</label><select id="pk_cat"><option value="">Choose…</option>${uniq(list.map(c => c.category)).map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label for="pk_sub">Sub-category</label><select id="pk_sub" disabled></select></div>
    <div class="field"><label for="pk_prod">Product</label><select id="pk_prod" disabled></select></div>
    <div class="field" style="flex:0 1 90px"><label for="pk_qty">Qty</label><input id="pk_qty" type="number" min="0" step="any" value="1"></div>
    <button type="button" class="btn" id="pk_add" disabled>+ Add</button>`;
  const cat = $('#pk_cat'), sub = $('#pk_sub'), prod = $('#pk_prod'), add = $('#pk_add');
  const fillProd = () => {
    const ps = list.filter(c => c.category === cat.value && c.subcategory === sub.value);
    prod.innerHTML = ps.map(c => `<option value="${c.id}">${esc(c.name)} — SAR ${money(c.rate)}${c.unit ? ' / ' + esc(c.unit) : ''}</option>`).join('');
    prod.disabled = !ps.length; add.disabled = !ps.length;
  };
  cat.onchange = () => {
    const subs = uniq(list.filter(c => c.category === cat.value).map(c => c.subcategory));
    const hasBlank = list.some(c => c.category === cat.value && !c.subcategory);
    sub.innerHTML = (hasBlank ? '<option value="">(General)</option>' : '') + subs.map(x => `<option>${esc(x)}</option>`).join('');
    sub.disabled = !cat.value; fillProd();
  };
  sub.onchange = fillProd;
  add.onclick = () => {
    const c = list.find(x => x.id === prod.value); if (!c) return;
    const it = {description: c.name + (c.description ? '\n' + c.description : '') + (c.unit ? ` (per ${c.unit})` : ''), qty: $('#pk_qty').value || '1', rate: String(c.rate), tax_pct: '15'};
    const blank = items.length === 1 && !items[0].description && !items[0].qty && !items[0].rate;
    if (blank) items[0] = it; else items.push(it);
    redraw(); toast(`${c.name} added`);
  };
}

        <span style="flex:1"></span>${!isNew && CAN_DELETE ? '<button class="btn danger" id="c_del">Delete</button>' : ''}</div><p class="err" id="c_err"></p></div>`;
    $('#c_cat').focus();
    $('#c_cancel').onclick = () => $('#cform').innerHTML = '';
    $('#c_save').onclick = async e => {
      const row = {category: $('#c_cat').value.trim(), subcategory: $('#c_sub').value.trim(), name: $('#c_name').value.trim(), unit: $('#c_unit').value.trim() || null,
                   rate: Number($('#c_rate').value || 0), description: $('#c_desc').value.trim() || null, active: $('#c_act').checked};
      if (!row.category || !row.name) { $('#c_err').textContent = 'Category and product name are required.'; return; }
      e.target.disabled = true;
      const res = isNew ? await sb.from('docs_catalog').insert(row) : await sb.from('docs_catalog').update({...row, updated_at: new Date().toISOString()}).eq('id', c.id);
      if (res.error) { e.target.disabled = false; $('#c_err').textContent = nice(res.error); return; }
      toast(isNew ? 'Product added' : 'Product updated'); CATALOG = null; route();
    };
    $('#c_del')?.addEventListener('click', async () => {
      if (!confirm(`Delete ${c.name} from the price list? (Existing quotations will not be affected.)`)) return;
      const {error} = await sb.from('docs_catalog').delete().eq('id', c.id);
      if (error) { $('#c_err').textContent = nice(error); return; }
      toast('Product deleted'); CATALOG = null; route();
    });
  };
  $('#q').addEventListener('input', draw); $('#fc').addEventListener('change', draw);
  $('#addc')?.addEventListener('click', () => form(null));
  $('#rows').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr && CAN_EDIT) { form(list.find(c => c.id === tr.dataset.id)); $('#cform').scrollIntoView({behavior: 'smooth', block: 'start'}); } });
  draw();
}

/* ============================== routing ============================== */
let ROUTE_SEQ = 0;
/* Save & New: after saving, open a fresh form of the same type */
let SAVE_NEW = false;
document.addEventListener('click', e => {
  if (e.target.closest('#save')) SAVE_NEW = false;
  if (e.target.closest('#saveNew')) { SAVE_NEW = true; $('#f')?.requestSubmit(); }
});
function goAfterSave(type, id) {
  const to = SAVE_NEW ? `#${type}/new` : `#${type}/${id}`; SAVE_NEW = false;
  if (location.hash !== to) location.hash = to; else route();
}
async function route() {
  ROUTE_SEQ++;
  const h = location.hash.replace(/^#/, '') || 'quotation';
  const [type, a, b] = h.split('/');
  if (!['quotation', 'invoice', 'dn', 'po', 'jobcard', 'mr', 'receipt', 'petty', 'catalog', 'customers'].includes(type)) { location.hash = '#quotation'; return; }
  $$('#tabs a').forEach(x => x.classList.toggle('on', x.dataset.t === type));
  const grp = $(`#tabs a[data-t="${type}"]`)?.dataset.g || 'sales';
  $$('#tabs a').forEach(x => x.hidden = x.dataset.g !== grp);
  $$('#groups a').forEach(x => x.classList.toggle('on', x.dataset.g === grp));
  try { localStorage.setItem('docs.lastIn.' + grp, type); } catch (e) {}
  $$('#groups a').forEach(x => { let last = null; try { last = localStorage.getItem('docs.lastIn.' + x.dataset.g); } catch (e) {}
    if (last && $(`#tabs a[data-t="${last}"][data-g="${x.dataset.g}"]`)) x.setAttribute('href', '#' + last); });
  if (type === 'catalog') return showCatalog();
  if (type === 'customers') { if (a === 'new' && !CAN_EDIT) { location.hash = '#customers'; return; } return a ? showCustomerForm(a === 'new' ? null : a) : showCustomers(); }
  const withCust = p => Promise.resolve(p).then(() => wireCustomer(type)).catch(() => {});
  {
    const form = type === 'petty' ? (i, c) => showPettyForm(i, c) : type === 'receipt' ? (i, c) => showReceiptForm(i, c) : (i, c) => showIForm(type, i, c);
    if (!a) return showIList(type);
    if (a === 'new') return CAN_EDIT ? withCust(form(null)) : (location.hash = '#' + type);
    if (a === 'copy') return CAN_EDIT ? withCust(form(null, b)) : (location.hash = '#' + type);
    if (a === 'receivables' && type === 'invoice') return showReceivables();
    if (a === 'fromquote' && type === 'invoice') return CAN_EDIT ? withCust(showIForm('invoice', null, null, b)) : (location.hash = '#invoice');
    return withCust(form(a));
  }
}
let lastHash = location.hash, goingBack = false;
window.addEventListener('hashchange', () => {
  if (goingBack) { goingBack = false; return; }
  if (dirty && !confirm('Your changes are not saved. Leave anyway?')) {
    goingBack = true; location.hash = lastHash; return;
  }
  dirty = false; lastHash = location.hash; route();
});
route();
})();
</script>
